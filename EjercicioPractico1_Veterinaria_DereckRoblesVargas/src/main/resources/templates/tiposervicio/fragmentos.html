<section th:fragment="formulario">
    <div class="row py-4 mb-2 bg-light">
        <div class="col-md-1"></div>
        <div class="col-md-3">
            <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#tipoServicioModal"
                    data-modo="agregar" th:data-titulo="#{tiposervicio.agregar}">
                <i class="fa-solid fa-plus"></i> [[#{tiposervicio.agregar}]]
            </button>
        </div>
    </div>
    <div class="modal fade" id="tipoServicioModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="tipoServicioForm" method="post" th:action="@{/tiposervicio/guardar}" th:object="${tipoServicio}">
                    <div class="modal-header" id="tipoServicioModalHeader">
                        <h5 class="modal-title" id="tipoServicioModalTitulo"></h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="tipoServicioId" th:field="*{id}"/>
                        <div class="mb-3">
                            <label for="tipoServicioNombre">[[#{tiposervicio.nombre}]]</label>
                            <input type="text" id="tipoServicioNombre" th:field="*{nombre}" class="form-control" maxlength="100" required/>
                        </div>
                        <div class="mb-3">
                            <label for="tipoServicioDescripcion">[[#{tiposervicio.descripcion}]]</label>
                            <input type="text" id="tipoServicioDescripcion" th:field="*{descripcion}" class="form-control" maxlength="255"/>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                            <i class="fa-solid fa-xmark"></i> [[#{accion.cerrar}]]
                        </button>
                        <button type="submit" class="btn btn-success">
                            <i class="fa-solid fa-floppy-disk"></i> [[#{accion.guardar}]]
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>

<section th:fragment="listado" class="p-3">
    <div class="row p-3">
        <div class="col-md-12">
            <div class="card p-2">
                <div class="card-header"><h4>[[#{tiposervicio.listado}]]</h4></div>
                <div class="card-body">
                    <div th:if="${tiposServicio != null and !tiposServicio.empty}">
                        <table class="table table-striped table-hover">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>[[#{tiposervicio.nombre}]]</th>
                                    <th>[[#{tiposervicio.descripcion}]]</th>
                                    <th>[[#{tiposervicio.cantidad}]]</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="t : ${tiposServicio}">
                                    <td>[[${t.id}]]</td>
                                    <td>[[${t.nombre}]]</td>
                                    <td>[[${t.descripcion}]]</td>
                                    <td>[[${t.servicios.size()}]]</td>
                                    <td>
                                        <button type="button" class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#confirmModal"
                                                th:data-bs-id="${t.id}" th:data-bs-descripcion="${t.nombre}">
                                            <i class="fa-solid fa-trash"></i> [[#{accion.eliminar}]]
                                        </button>
                                        <button type="button" class="btn btn-warning" data-bs-toggle="modal" data-bs-target="#tipoServicioModal"
                                                data-modo="editar" th:data-titulo="#{accion.actualizar}" th:data-id="${t.id}"
                                                th:data-nombre="${t.nombre}" th:data-descripcion="${t.descripcion}">
                                            <i class="fa-solid fa-pen"></i> [[#{accion.actualizar}]]
                                        </button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="text-center p-2" th:if="${tiposServicio == null or tiposServicio.empty}">
                        <span>[[#{lista.vacia}]]</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
