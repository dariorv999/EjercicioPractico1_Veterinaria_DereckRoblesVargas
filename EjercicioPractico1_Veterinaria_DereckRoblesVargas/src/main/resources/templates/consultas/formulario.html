<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{general/plantilla :: layout(~{::#contenido}, ~{})}">
    <body>
        <div id="contenido" class="container py-4">
            <div class="card p-2">
                <div class="card-header"><h4>[[#{consulta.titulo}]]</h4></div>
                <div class="card-body">
                    <form th:action="@{/consultas/enviar}" method="post">
                        <div class="mb-3">
                            <label for="nombre">[[#{consulta.nombre}]]</label>
                            <input type="text" id="nombre" name="nombre" class="form-control" required/>
                        </div>
                        <div class="mb-3">
                            <label for="correo">[[#{consulta.correo}]]</label>
                            <input type="email" id="correo" name="correo" class="form-control" required/>
                        </div>
                        <div class="mb-3">
                            <label for="mascota">[[#{consulta.mascota}]]</label>
                            <input type="text" id="mascota" name="mascota" class="form-control" required/>
                        </div>
                        <div class="mb-3">
                            <label for="mensaje">[[#{consulta.mensaje}]]</label>
                            <textarea id="mensaje" name="mensaje" rows="4" class="form-control" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-success">
                            <i class="fa-solid fa-paper-plane"></i> [[#{accion.enviar}]]
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </body>
</html>
