<section th:fragment="formulario">
    <div class="row py-4 mb-2 bg-light">
        <div class="col-md-1"></div>
        <div class="col-md-3">
            <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#servicioModal"
                    data-modo="agregar" th:data-titulo="#{servicio.agregar}">
                <i class="fa-solid fa-plus"></i> [[#{servicio.agregar}]]
            </button>
        </div>
    </div>
    <div class="modal fade" id="servicioModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="servicioForm" method="post" th:action="@{/servicio/guardar}" th:object="${servicio}">
                    <div class="modal-header" id="servicioModalHeader">
                        <h5 class="modal-title" id="servicioModalTitulo"></h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="servicioId" th:field="*{id}"/>
                        <div class="mb-3">
                            <label for="servicioTipo">[[#{servicio.tipo}]]</label>
                            <select id="servicioTipo" th:field="*{tipoServicio.id}" class="form-select" required>
                                <option th:each="t : ${tiposServicio}" th:value="${t.id}">[[${t.nombre}]]</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="servicioNombre">[[#{servicio.nombre}]]</label>
                            <input type="text" id="servicioNombre" th:field="*{nombre}" class="form-control" maxlength="100" required/>
                        </div>
                        <div class="mb-3">
                            <label for="servicioPrecio">[[#{servicio.precio}]]</label>
                            <input type="number" id="servicioPrecio" th:field="*{precio}" class="form-control" min="0" step="0.01" required/>
                        </div>
                        <div class="mb-3">
                            <label for="servicioDuracion">[[#{servicio.duracion}]]</label>
                            <input type="number" id="servicioDuracion" th:field="*{duracionMinutos}" class="form-control" min="1" step="1" required/>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                            <i class="fa-solid fa-xmark"></i> [[#{accion.cerrar}]]
                        </button>
                        <button type="submit" class="btn btn-success">
                            <i class="fa-solid fa-floppy-disk"></i> [[#{accion.guardar}]]
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>

<section th:fragment="listado" class="p-3">
    <div class="row p-3">
        <div class="col-md-12">
            <div class="card p-2">
                <div class="card-header"><h4>[[#{servicio.listado}]]</h4></div>
                <div class="card-body">
                    <div th:if="${servicios != null and !servicios.empty}">
                        <table class="table table-striped table-hover">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>[[#{servicio.nombre}]]</th>
                                    <th>[[#{servicio.tipo}]]</th>
                                    <th>[[#{servicio.precio}]]</th>
                                    <th>[[#{servicio.duracion}]]</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="s : ${servicios}">
                                    <td>[[${s.id}]]</td>
                                    <td>[[${s.nombre}]]</td>
                                    <td>[[${s.tipoServicio.nombre}]]</td>
                                    <td>₡[[${#numbers.formatDecimal(s.precio, 1, 'COMMA', 2, 'POINT')}]]</td>
                                    <td>[[${s.duracionMinutos}]]</td>
                                    <td>
                                        <button type="button" class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#confirmModal"
                                                th:data-bs-id="${s.id}" th:data-bs-descripcion="${s.nombre}">
                                            <i class="fa-solid fa-trash"></i> [[#{accion.eliminar}]]
                                        </button>
                                        <button type="button" class="btn btn-warning" data-bs-toggle="modal" data-bs-target="#servicioModal"
                                                data-modo="editar" th:data-titulo="#{accion.actualizar}" th:data-id="${s.id}"
                                                th:data-tipo="${s.tipoServicio.id}" th:data-nombre="${s.nombre}"
                                                th:data-precio="${s.precio}" th:data-duracion="${s.duracionMinutos}">
                                            <i class="fa-solid fa-pen"></i> [[#{accion.actualizar}]]
                                        </button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="text-center p-2" th:if="${servicios == null or servicios.empty}">
                        <span>[[#{lista.vacia}]]</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
